# Nome do Workflow
name: Backend CI - Spring Boot Build and Test

# Define os eventos que disparam este workflow
on:
  push:
    branches: [ developer ]
  pull_request:
    branches: [ developer ]
  workflow_dispatch:

# Define os trabalhos
jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      # Passo 1: Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Configurar o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Passo 3: Tornar o Maven Wrapper (mvnw) executável
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
        working-directory: ./backend # Mantém aqui para facilitar o chmod

      # Passo 4: Construir com Maven Wrapper
      - name: Build with Maven Wrapper
        run: ./backend/mvnw package --batch-mode -f backend/pom.xml 

      # Passo 5: Listar conteúdo da pasta target 
      - name: List target directory contents
        run: ls -l backend/target/ 
        if: always()