# Nome do Workflow que vai aparecer no Github Actions
name: Backend CI - Spring Boot Build and Test

# Define os eventos que disparam este workflow
on:
  push:
    branches: [ developer, main ]

  pull_request:
    branches: [ developer, main ]

  workflow_dispatch:

# Define os trabalhos
jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest

    # Container de serviço para o job
    services:

      # Hostname do serviço
      postgres:
        image: postgres:15
        
        # Variáveis de ambiente para configurar o container postgres
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}

        # Mapeamento explícito da porta interna 5432 para uma porta no host (runner)
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Passo 1: Checkout do código (clona o repositório para dentro do runner)
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Configurar o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      # Passo 3: Tornar o Maven Wrapper (mvnw) executável
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
        working-directory: ./backend

      # Passo 4: Construir com Mavem Wrapper
      - name: Build and Test with Maven Wrapper
        env:
          # --- Variáveis da Base de Dados (Para o Service Container) ---
          # Conecta-se como o 'testuser' à 'testdb'
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports['5432'] }}/${{ secrets.TEST_DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.TEST_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect

          # --- Variáveis de JPA (Usando valores de Teste) ---
          # Usa 'update' e o schema 'public', não 'schema_es2'
          SPRING_JPA_HIBERNATE_DDL_AUTO: ${{ secrets.SPRING_JPA_HIBERNATE_DDL_AUTO }}
          SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${{ secrets.SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA }}

          # --- Variáveis de Email (Usando valores de Teste/Dummy) ---
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}
          SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}

          # --- Variáveis de JWT (Usando valores de Teste) ---
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_JWT_EXPIRATION_MS: ${{ secrets.APP_JWT_EXPIRATION_MS }}
          
          # --- NOVA Variável de Frontend URL ---
          APP_FRONTEND_URL: ${{ secrets.APP_FRONTEND_URL }}

        run: ./backend/mvnw package --batch-mode -f backend/pom.xml

      # Passo 5: Listar conteúdo da pasta target (para veririficar o JAR)
      - name: List target directory contents
        run: ls -l backend/target/
        if: always()

      # Passo 6: Upload do Artefato JAR (!! VER MELHOR COM A ESCALA DO PROJETO !!)
      #- name: Upload JAR artifact
      #  uses: actions/upload-artifact@v4
      #  if: success()
      #  with:
      #    name: backend-jar
      #    path: backend/target/apiparticipantes-*.jar
      #    retention-days: 7

  # Job para CD
  docker-build-push-backend:
    needs: build-and-test-backend # Só executa se os testes passaram
    runs-on: ubuntu-latest
    # Permissões necessárias para enviar pacotes para o GitHub Container Registry
    permissions:
      contents: read
      packages: write

    steps:
      # Passo 1: Checkout do código (clona o repositório para dentro do runner)
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Configurar o Docker Buildx (necessário para recursos avançados de build)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Passo 3: Fazer login no GitHub Container Registry (GHCR)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Usa o GITHUB_TOKEN automático, não precisa de criar segredo novo.

      # Passo 4: Gerar metadados (tags, labels) para a imagem Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with: # Isto garante que se o push for na 'main', a tag é 'main' (e talvez 'latest')
          images: ghcr.io/${{ github.repository }}/backend # Se for na 'developer', a tag é 'developer'
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Passo 5: Construir e Enviar a Imagem
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }} # Usa as tags e labels geradas automaticamente pelo passo anterior
          labels: ${{ steps.meta.outputs.labels }}