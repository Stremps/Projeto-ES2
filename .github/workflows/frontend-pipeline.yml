# Nome do Workflow que vai aparecer no Github Actions
name: Frontend CI - Angular Build and Test

# Define os eventos que disparam este workflow
on:
  push:
    branches: [ developer, main ]

  pull_request:
    branches: [ developer, main ]
  
  workflow_dispatch:

# Define os trabalhos
jobs:
  build-and-test-frontend:
    runs-on: ubuntu-latest

    # Passos executados dentro do job
    steps:
      # Passo 1: Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4

      # Passo 2: Configurar o Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20' # Pareado ao que é usado no dockerfile
          cache: 'npm' # Habilita o gerenciador de pacotes
          cache-dependency-path: frontend/package-lock.json # Onde o cache deve procurar o arquivo de lock

      # Passo 3: Instalar Dependências (npm ci)
      - name: Install dependencies
        run: npm ci # Usamos ci (Clean Install) ao invés de somente install
        working-directory: ./frontend

      # # Passo 4: Executar testes unitários (COLOCAR DEPOIS QUE ARRUMAR MELHOR AMBIENTE)
      # - name: Run unit tests
      #   # '--watch=false' diz ao Angular para rodar os testes apenas uma vez e sair
      #   # '--browsers=ChromeHeadless' diz ao Angular para usar o Chrome em modo sem interface gráfica
      #   run: npm test -- --watch=false --browsers=ChromeHeadless
      #   working-directory: ./frontend

      # Passo 5: Executar Build de Produção
      - name: Build for production
        run: npm run build
        working-directory: ./frontend

  # Job para CD
  docker-build-push-frontend:
    needs: build-and-test-frontend # Só executa se os testes passaram
    runs-on: ubuntu-latest
    # Permissões necessárias para enviar pacotes para o GitHub Container Registry
    permissions:
      contents: read
      package: write

    
    steps:
      # Passo 1: Checkout do código
      - name: Checkout code
        uses: actions/checkout@v4
    
      # Passo 2: Configurar o motor de build avanado do Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Passo 3: Faz login no registro (GHCR) automaticamente
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Passo 4: Gerar metadados (tags, labels) para a imagem Docker no frontend
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images:
            images: ghcr.io/${{ github.repository }}/frontend
            tags: |
              type=ref,event=branch
              type=raw,value=latest,enable={{is_default_branch}}
      
      # Passo 5: Build e Push dentro contexto do frontend de produção
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}